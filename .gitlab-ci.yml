---

include:
  - project: 'saltbox/ci-lib'
    file: 'build-image.yml'


stages:
  - lint
  - build


variables:
  LINTING_ENABLED: true


.lint-job:
  stage: lint
  variables:
    PIP_CACHE_DIR: '$CI_PROJECT_DIR/.cache/pip'
  image: python:3.12-alpine
  before_script:
    - apk add git
    - pip3 install .[lint]
  cache:
    paths:
      - '.cache/pip/'
  rules:
    - if: $LINTING_ENABLED == 'true'


.default-build:
  extends: .build-image
  dependencies: []


.build-keycloak-init-image:
  extends: .default-build
  stage: build
  variables:
    DOCKERFILE: 'Dockerfile'
    TARGET: keycloak-init


Ruff:
  extends: .lint-job
  script: ruff check saltbox_keycloak_init


Mypy:
  extends: .lint-job
  script: mypy saltbox_keycloak_init


Build keycloak-init image for tag:
  extends: .build-keycloak-init-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG'


Build keycloak-init image for branch:
  extends: .build-keycloak-init-image
  variables:
    IMAGE_TAG: '$CI_COMMIT_BRANCH'
  rules:
    - if: '$CI_COMMIT_BRANCH'
